<html>
    <head>
        <title>Field Agent Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <div>
            <h1>Field Agent Section</h1>
            <p>Fill in below:</p>
            <form action="StartSessionServlet.do" method="post">
                <table>
                    <tr>
                        <td>ID:</td>
                        <td>
                            <input type="text" name="id" placeholder="3-digit"/>
                        </td>
                    </tr>
                    <tr>
                        <td>Name:</td>
                        <td>
                            <input type="text" name="name"/>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <button type="submit">PROCEED</button>
                        </td>
                    </tr>
                </table>
            </form>
            <table>
                <tr>
                    <td>
                        <button onclick="location.href='menu.html'">BACK</button>
                    </td>
                </tr>
            </table>
        </div>
    </body>
</html>
