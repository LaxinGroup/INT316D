<html>
    <head>
        <title>View Agents Per Gender Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <h1>View Agents Per Gender</h1>
            <p>Choose below:</p>
            <form action="GetAgentsPerGenderServlet.do" method="POST">
                <table>
                    <tr>
                        <td>Gender:</td>
                        <td>
                            <select name="gender">
                                <option value="M">Male</option>
                                <option value="F">Female</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="GET"/>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </body>
</html>
